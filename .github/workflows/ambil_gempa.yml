name: Ambil data gempa

on:
  workflow_dispatch:      # tombol "Run workflow" manual
  schedule:
    - cron: "17,47 * * * *"

jobs:
  ambil:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Tulis kunci GCP
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: printf '%s' "$GCP_SA_KEY" > service-account.json

      - run: python ambil_gempa.py
      - run: python muat_raw.py
      - run: python parse_gempa.py
      - run: python muat_bigquery.py

      - uses: actions/upload-artifact@v4
        with:
          name: data-gempa
          path: data/
          retention-days: 3
