name: Ambil data gempa

on:
  workflow_dispatch:      # tombol "Run workflow" manual
  # schedule:             # aktifkan nanti, setelah ada penyimpanan data
  #   - cron: "*/30 * * * *"

jobs:
  ambil:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - run: python ambil_gempa.py

      - uses: actions/upload-artifact@v4
        with:
          name: data-gempa
          path: data/